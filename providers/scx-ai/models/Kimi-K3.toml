# SCX enforces a single context budget (prompt + max_tokens <= context) with no
# separate output cap, so output equals the 1048576 context and is overridden
# from the moonshotai/kimi-k3 base entry. Thinking is returned as
# `reasoning_content` on the message. Effort set matches the lab entry and
# DeepInfra (low/high/max), not verified against SCX.
schema = 2
base_model = "moonshotai/kimi-k3"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true

[limit]
output = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 2.8274
cache = { read = 0.2809 }

[cost.text.output]
price = 14.1307