# Thinking is returned as `reasoning_content` on the message; the effort set is
# the deployment's accepted reasoning_effort values.
schema = 2
base_model = "moonshotai/kimi-k2.7-code"

[capabilities]
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "xhigh"] }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.8051
cache = { read = 0.1623 }

[cost.text.output]
price = 3.3392