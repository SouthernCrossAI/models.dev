# Thinking is returned as `reasoning_content` on the message. Effort set matches
# the closest relay peer (Requesty), not verified against SCX.
schema = 2
base_model = "moonshotai/kimi-k2.7-code"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "max"] }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.8051
cache = { read = 0.1623 }

[cost.text.output]
price = 3.3392